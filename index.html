<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parker's Basketball Highlights</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127936;</text></svg>">
    <meta name="description" content="Watch Parker's best basketball highlights from the 2025-26 Shooting Stars season. Layups, steals, blocks, and more.">
    <meta property="og:title" content="Parker's Basketball Highlights">
    <meta property="og:description" content="Season 2025-26 Shooting Stars — layups, steals, blocks, and more.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://img.youtube.com/vi/q2goPYTCFU8/maxresdefault.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        /* ==========================================
           CSS VARIABLES
           ========================================== */
        :root {
            --bg: #0a0a0c;
            --card-bg: #131318;
            --accent: #ff6b2b;
            --accent-glow: rgba(255, 107, 43, 0.15);
            --accent-glow-subtle: rgba(255, 107, 43, 0.08);
            --text-primary: #f0eef5;
            --text-secondary: #8a8599;
            --text-tertiary: #4a4658;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-pill: 100px;
        }

        /* ==========================================
           RESET & BASE
           ========================================== */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'Barlow', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            line-height: 1.5;
        }

        body.modal-open {
            overflow: hidden;
        }

        /* ==========================================
           HERO SECTION
           ========================================== */
        .hero {
            text-align: center;
            padding: 4rem 1rem 3rem;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 400px;
            background: radial-gradient(ellipse, rgba(255, 107, 43, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: glowPulse 4s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
            50% { opacity: 0.6; transform: translateX(-50%) scale(1.08); }
        }

        .hero::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, var(--accent) 30%, var(--accent) 70%, transparent 100%);
            opacity: 0.5;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 107, 43, 0.1);
            border: 1px solid rgba(255, 107, 43, 0.2);
            border-radius: var(--radius-pill);
            padding: 0.4rem 1.2rem;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeDown 0.5s ease-out 0.2s forwards;
        }

        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            line-height: 0.9;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeDown 0.5s ease-out 0.4s forwards;
        }

        .hero-title .line1 {
            display: block;
            font-size: clamp(48px, 12vw, 80px);
            color: #ffffff;
            letter-spacing: 6px;
        }

        .hero-title .line2 {
            display: block;
            font-size: clamp(48px, 12vw, 80px);
            color: var(--accent);
            letter-spacing: 6px;
        }

        .hero-detail {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-top: 1rem;
            position: relative;
            z-index: 1;
            opacity: 0;
            animation: fadeDown 0.5s ease-out 0.6s forwards;
        }

        .hero-detail .number {
            color: var(--accent);
            font-weight: 700;
        }

        /* ==========================================
           CLIPS SECTION
           ========================================== */
        .clips-section {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 1rem;
            opacity: 0;
            animation: fadeUp 0.5s ease-out 0.8s forwards;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .section-title::before {
            content: "";
            width: 3px;
            height: 20px;
            background: var(--accent);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .section-title h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 3px;
            color: var(--text-primary);
            font-weight: 400;
        }

        .clip-count {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* Tag Filters */
        .tag-filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            overflow-x: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            padding-bottom: 0.25rem;
        }

        .tag-filters::-webkit-scrollbar {
            display: none;
        }

        .tag-btn {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 0.4rem 1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--text-tertiary);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .tag-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .tag-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        /* Clip Grid */
        .clip-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .clip-card {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            opacity: 0;
            animation: fadeUp 0.5s ease-out forwards;
        }

        .clip-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4),
                        0 0 20px var(--accent-glow-subtle);
            border-color: rgba(255, 107, 43, 0.2);
        }

        .clip-card.hidden {
            display: none;
        }

        .clip-thumb {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Square thumbnails — compact browse */
            background: #0d0d10;
            overflow: hidden;
        }

        .clip-thumb img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 16px rgba(255, 107, 43, 0.3);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .play-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
            margin-left: 2px;
        }

        .clip-card:hover .play-btn {
            transform: translate(-50%, -50%) scale(1.1);
            box-shadow: 0 6px 24px rgba(255, 107, 43, 0.5);
        }

        .clip-info {
            padding: 0.5rem 0.6rem;
        }

        .clip-title {
            font-family: 'Barlow', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .clip-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.2rem;
        }

        .clip-date {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .clip-tag {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.1rem 0.45rem;
            border-radius: var(--radius-pill);
            background: rgba(255, 107, 43, 0.15);
            color: var(--accent);
        }

        /* ==========================================
           VIDEO MODAL
           ========================================== */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-backdrop.active {
            display: flex;
            opacity: 1;
        }

        .modal-backdrop.entering {
            opacity: 0;
        }

        .modal-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            transform: translateY(20px) scale(0.97);
            transition: transform 0.3s ease;
        }

        .modal-backdrop.active .modal-container {
            transform: translateY(0) scale(1);
        }

        .modal-backdrop.entering .modal-container {
            transform: translateY(20px) scale(0.97);
        }

        .modal-close {
            position: absolute;
            top: -44px;
            right: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-video {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* 9:16 portrait for Shorts */
            background: #000;
            border-radius: var(--radius) var(--radius) 0 0;
            overflow: hidden;
        }

        .modal-video iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .modal-info {
            background: var(--card-bg);
            padding: 1rem 1.25rem;
            border-radius: 0 0 var(--radius) var(--radius);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .modal-title {
            font-family: 'Barlow', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .modal-date {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .modal-tag {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 0.2rem 0.7rem;
            border-radius: var(--radius-pill);
            background: rgba(255, 107, 43, 0.15);
            color: var(--accent);
        }

        /* ==========================================
           FOOTER
           ========================================== */
        footer {
            text-align: center;
            padding: 2rem 1rem;
            padding-bottom: calc(2rem + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: auto;
        }

        footer p {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        .footer-brand {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            font-weight: 700;
            letter-spacing: 4px;
        }

        .footer-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            border-radius: 3px;
            background: var(--accent);
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.55rem;
            color: #fff;
            letter-spacing: 0;
            line-height: 1;
        }

        /* ==========================================
           MOBILE TAP STATE
           ========================================== */
        @media (hover: none) {
            .clip-card:hover {
                transform: none;
                box-shadow: none;
                border-color: rgba(255, 255, 255, 0.04);
            }

            .clip-card:hover .play-btn {
                transform: translate(-50%, -50%);
                box-shadow: 0 4px 16px rgba(255, 107, 43, 0.3);
            }

            .clip-card:active {
                transform: scale(0.97);
            }

            .clip-card:active .play-btn {
                transform: translate(-50%, -50%) scale(0.9);
            }
        }

        /* ==========================================
           EMPTY STATE
           ========================================== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state p {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }

        /* ==========================================
           ANIMATIONS
           ========================================== */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-badge, .hero-title, .hero-detail,
            .clips-section, .clip-card, .hero::before {
                animation: none !important;
                opacity: 1 !important;
            }
            .modal-backdrop, .modal-container {
                transition: none !important;
            }
        }

        /* ==========================================
           RESPONSIVE — TABLET (600px+)
           ========================================== */
        @media (min-width: 600px) {
            .clip-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }

            .clips-section {
                padding: 3rem 2rem;
            }

            .hero {
                padding: 5rem 2rem 3.5rem;
            }

            .play-btn {
                width: 48px;
                height: 48px;
            }

            .play-btn svg {
                width: 18px;
                height: 18px;
            }

            .clip-info {
                padding: 0.6rem 0.75rem;
            }

            .clip-title {
                font-size: 0.8rem;
            }
        }

        /* ==========================================
           RESPONSIVE — DESKTOP (900px+)
           ========================================== */
        @media (min-width: 900px) {
            .clip-grid {
                gap: 16px;
            }

            .clips-section {
                padding: 3.5rem 2rem;
            }

            .hero {
                padding: 6rem 2rem 4rem;
            }
        }

        /* ==========================================
           RESPONSIVE — MODAL MOBILE (<480px)
           ========================================== */
        @media (max-width: 479px) {
            .modal-backdrop {
                padding: 0;
                align-items: stretch;
            }

            .modal-container {
                max-width: none;
                display: flex;
                flex-direction: column;
                justify-content: center;
                height: 100%;
                padding: 2.5rem 0 0;
            }

            .modal-video {
                border-radius: 0;
                /* Fill available height: use vh-based calc so video is as tall as possible */
                padding-top: 0;
                flex: 1;
                min-height: 0;
            }

            .modal-video iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

            .modal-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.4rem;
                border-radius: 0;
                padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
            }

            .modal-close {
                top: 0.5rem;
                right: 0.5rem;
                z-index: 10;
                background: rgba(0, 0, 0, 0.5);
            }
        }
    </style>
</head>
<body>

    <!-- ==========================================
         HERO SECTION
         ========================================== -->
    <section class="hero">
        <div class="hero-badge">&#127936; Shooting Stars Basketball</div>
        <h1 class="hero-title">
            <span class="line1">PARKER</span>
            <span class="line2">HIGHLIGHTS</span>
        </h1>
        <p class="hero-detail"><span class="number">#22</span> &middot; Season 2025&ndash;26</p>
    </section>

    <!-- ==========================================
         CLIPS SECTION
         ========================================== -->
    <section class="clips-section">
        <div class="section-header">
            <div class="section-title">
                <h2>Latest Clips</h2>
            </div>
            <span class="clip-count" id="clipCountLabel">12 clips</span>
        </div>

        <div class="tag-filters" id="tagFilters">
            <!-- Rendered by JS with counts -->
        </div>

        <div class="clip-grid" id="clipGrid">
            <!-- Clips rendered by JS -->
        </div>
    </section>

    <!-- ==========================================
         FOOTER
         ========================================== -->
    <footer>
        <p>Built by <span class="footer-brand"><span class="footer-logo">PD</span>PARKER'S DAD</span></p>
    </footer>

    <!-- ==========================================
         VIDEO MODAL
         ========================================== -->
    <div class="modal-backdrop" id="videoModal">
        <div class="modal-container">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-video" id="modalVideo"></div>
            <div class="modal-info">
                <span class="modal-title" id="modalTitle"></span>
                <span class="modal-date" id="modalDate"></span>
                <span class="modal-tag" id="modalTag"></span>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // CLIP DATA
        // ==========================================
        var clips = [
            { id: 1,  title: "Wrestle for the Ball",                    date: "Feb 8",  tag: "HUSTLE",  videoId: "YfqaPLXb5OQ" },
            { id: 2,  title: "Quick to the Paint Layup",                date: "Feb 8",  tag: "OFFENSE", videoId: "q2goPYTCFU8" },
            { id: 3,  title: "Great Play",                              date: "Feb 8",  tag: "OFFENSE", videoId: "aRYveQX8mrk" },
            { id: 4,  title: "Epic Block",                              date: "Feb 1",  tag: "DEFENSE", videoId: "wO08Zoo8_yI" },
            { id: 5,  title: "3 Pointer",                               date: "Feb 1",  tag: "OFFENSE", videoId: "mfPTIPFJ3Q4" },
            { id: 6,  title: "3 Pointer",                               date: "Feb 1",  tag: "OFFENSE", videoId: "fSjj15HjwOc" },
            { id: 7,  title: "Put Back",                                date: "Feb 1",  tag: "OFFENSE", videoId: "1cuSjBGRdqg" },
            { id: 8,  title: "Fast Break Layup",                        date: "Feb 1",  tag: "OFFENSE", videoId: "C2wvALNrk_A" },
            { id: 9,  title: "Steal and Lay Up",                        date: "Jan 25", tag: "OFFENSE", videoId: "7wyL8ckP4Gg" },
            { id: 10, title: "Steal, Free Throws, Steal",               date: "Jan 25", tag: "HUSTLE",  videoId: "N6NF9gWMfGY" },
            { id: 11, title: "Steal and Both Free Throws",              date: "Jan 25", tag: "OFFENSE", videoId: "2Ys3XeLCoc0" },
            { id: 12, title: "Lay-up!",                                 date: "Jan 18", tag: "OFFENSE", videoId: "tzybTPNs5iI" }
        ];

        // ==========================================
        // TAG COUNTS & FILTER BUTTONS
        // ==========================================
        var tags = ['ALL', 'OFFENSE', 'DEFENSE', 'HUSTLE'];
        var tagCounts = {};
        tags.forEach(function(t) {
            tagCounts[t] = t === 'ALL' ? clips.length : clips.filter(function(c) { return c.tag === t; }).length;
        });

        var filtersContainer = document.getElementById('tagFilters');
        tags.forEach(function(t) {
            var btn = document.createElement('button');
            btn.className = 'tag-btn' + (t === 'ALL' ? ' active' : '');
            btn.setAttribute('data-tag', t);
            btn.textContent = (t === 'ALL' ? 'All' : t.charAt(0) + t.slice(1).toLowerCase()) + ' (' + tagCounts[t] + ')';
            filtersContainer.appendChild(btn);
        });

        // ==========================================
        // RENDER CLIPS
        // ==========================================
        var grid = document.getElementById('clipGrid');

        function renderClips(filter) {
            grid.innerHTML = '';
            var visible = filter === 'ALL' ? clips : clips.filter(function(c) { return c.tag === filter; });

            document.getElementById('clipCountLabel').textContent = visible.length + ' clip' + (visible.length !== 1 ? 's' : '');

            if (visible.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No clips yet</p></div>';
                return;
            }

            visible.forEach(function(clip, i) {
                var card = document.createElement('div');
                card.className = 'clip-card';
                card.style.animationDelay = (0.9 + i * 0.06) + 's';
                card.setAttribute('data-id', clip.id);

                card.innerHTML =
                    '<div class="clip-thumb">' +
                        '<img src="https://img.youtube.com/vi/' + clip.videoId + '/hqdefault.jpg"' +
                        ' alt="' + clip.title + '" loading="lazy">' +
                        '<div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19"/></svg></div>' +
                    '</div>' +
                    '<div class="clip-info">' +
                        '<div class="clip-title">' + clip.title + '</div>' +
                        '<div class="clip-meta">' +
                            '<span class="clip-date">' + clip.date + '</span>' +
                            '<span class="clip-tag">' + clip.tag + '</span>' +
                        '</div>' +
                    '</div>';

                card.addEventListener('click', function() {
                    openModal(clip);
                });

                grid.appendChild(card);
            });
        }

        renderClips('ALL');

        // ==========================================
        // TAG FILTER CLICKS
        // ==========================================
        filtersContainer.addEventListener('click', function(e) {
            var btn = e.target.closest('.tag-btn');
            if (!btn) return;
            filtersContainer.querySelectorAll('.tag-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            renderClips(btn.getAttribute('data-tag'));
        });

        // ==========================================
        // VIDEO MODAL
        // ==========================================
        var modal = document.getElementById('videoModal');
        var modalVideo = document.getElementById('modalVideo');
        var modalTitle = document.getElementById('modalTitle');
        var modalDate = document.getElementById('modalDate');
        var modalTag = document.getElementById('modalTag');
        var modalClose = document.getElementById('modalClose');

        function openModal(clip) {
            modalVideo.innerHTML = '<iframe src="https://www.youtube.com/embed/' + clip.videoId + '?autoplay=1&rel=0" allowfullscreen allow="autoplay; encrypted-media"></iframe>';
            modalTitle.textContent = clip.title;
            modalDate.textContent = clip.date;
            modalTag.textContent = clip.tag;

            modal.classList.add('active', 'entering');
            document.body.classList.add('modal-open');

            // Trigger reflow then remove entering class for animation
            modal.offsetHeight;
            modal.classList.remove('entering');
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.classList.remove('modal-open');
            modalVideo.innerHTML = '';
        }

        modalClose.addEventListener('click', closeModal);

        modal.addEventListener('click', function(e) {
            if (e.target === modal) closeModal();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeModal();
            }
        });
    </script>

</body>
</html>
